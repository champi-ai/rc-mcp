name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to avoid burning CI minutes on
# stale pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
