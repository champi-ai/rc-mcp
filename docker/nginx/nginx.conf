worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream mcp_server {
        server mcp-server:8080;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # GET /health: unauthenticated liveness check, outside the MCP
        # protocol surface (Section 14).
        location = /health {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # MCP client endpoint: Streamable HTTP, SSE-based streaming.
        # Buffering/caching MUST be off so progress notifications and
        # long-lived SSE streams aren't held in nginx's buffer.
        location /mcp {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_set_header Connection "";
        }

        # Desktop agent WebSocket endpoint.
        location /agent/ws {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Note: the admin API (port 9090) is intentionally NOT proxied
        # here. It is reachable only on 127.0.0.1:9090 on the server
        # host itself (see docs/specs/backend.md Section 12.4).
    }
}
