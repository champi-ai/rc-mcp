worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Sticky sessions for multi-replica deployments (Section 10, Section
    # 19): an MCP session's SSE stream must always land on the replica
    # that opened it, since the session (and, until the pub/sub
    # cross-replica dispatch routing lands, the agent WebSocket
    # connections it needs to reach) lives in that replica's process
    # memory or in its Redis-backed store keyed for that replica's
    # connections.
    #
    # ip_hash is the simplest sticky strategy: nginx hashes the client's
    # IP to consistently pick the same upstream. It requires no
    # application cooperation, but breaks stickiness for clients behind a
    # shared NAT/proxy (they all hash to the same replica) and for a
    # client whose IP changes mid-session. It is used here as the
    # default because the MCP client is typically a single long-lived
    # process (an LLM host) rather than many browsers behind one NAT.
    upstream mcp_server {
        ip_hash;
        server mcp-server:8080;
        server mcp-server-2:8080;
    }

    # --- Alternative: sticky cookie keyed by Mcp-Session-Id ---
    # If ip_hash's per-client-IP granularity doesn't fit your deployment
    # (e.g. many MCP clients behind one NAT), key stickiness on the
    # Mcp-Session-Id response header instead, using nginx's open source
    # `ngx_http_upstream_hash` module keyed on a header extracted via
    # map, or (simpler in practice) the commercial NGINX Plus
    # `sticky cookie` directive. A dependency-free open-source approach:
    #
    #   map $upstream_http_mcp_session_id $sticky_key {
    #       default $upstream_http_mcp_session_id;
    #       ""      $remote_addr;   # no session yet (first request): fall
    #                               # back to ip_hash-style behavior
    #   }
    #   upstream mcp_server {
    #       hash $sticky_key consistent;
    #       server mcp-server:8080;
    #       server mcp-server-2:8080;
    #   }
    #
    # This requires nginx's `Set-Cookie`/response-header value to be
    # readable via $upstream_http_* on the *response* that first created
    # the session, then re-sent by the client as a request header on
    # subsequent calls -- Mcp-Session-Id is already such a client-echoed
    # header per the Streamable HTTP transport, making this the more
    # session-aware alternative once you need it.

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # GET /health: unauthenticated liveness check, outside the MCP
        # protocol surface (Section 14). Deliberately NOT sticky --
        # either replica answering is fine, and spreading health checks
        # across both catches a single unhealthy replica.
        location = /health {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # MCP client endpoint: Streamable HTTP, SSE-based streaming.
        # Buffering/caching MUST be off so progress notifications and
        # long-lived SSE streams aren't held in nginx's buffer.
        location /mcp {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_set_header Connection "";
        }

        # Desktop agent WebSocket endpoint. Also subject to ip_hash: an
        # agent's reconnect should preferably land back on the same
        # replica that held its dispatch state during the reconnect grace
        # period (Section 2.1), though this is a best-effort optimization,
        # not a correctness requirement -- cross-replica dispatch routing
        # (the pub/sub follow-up) is what makes correctness independent of
        # which replica an agent lands on.
        location /agent/ws {
            proxy_pass http://mcp_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Note: the admin API (port 9090) is intentionally NOT proxied
        # here, in every deployment shape. It is reachable only on
        # 127.0.0.1:9090 on each server host itself (Section 12.4); in a
        # multi-replica deployment an operator manages each replica's
        # admin API independently (or via SSH/exec into each host/container).
    }
}
