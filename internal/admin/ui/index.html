<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rc-mcp admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --fg-muted: #595959;
    --border: #ddd;
    --border-subtle: #eee;
    --code-bg: #f2f2f2;
    --btn-bg: #fafafa;
    --btn-bg-hover: #eee;
    --btn-border: #ccc;
    --danger: #b3261e;
    --badge-on-bg: #d7f5dd;
    --badge-on-fg: #146029;
    --badge-off-bg: #e2e2e2;
    --badge-off-fg: #4d4d4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #f0f0f0;
      --fg-muted: #b3b3b3;
      --border: #3a3a3a;
      --border-subtle: #2c2c2c;
      --code-bg: #262626;
      --btn-bg: #262626;
      --btn-bg-hover: #333;
      --btn-border: #555;
      --danger: #ff6b60;
      --badge-on-bg: #143d22;
      --badge-on-fg: #7ee2a0;
      --badge-off-bg: #333;
      --badge-off-fg: #cfcfcf;
    }
  }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; max-width: 960px; background: var(--bg); color: var(--fg); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--fg-muted); margin: 0 0 24px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .03em; color: var(--fg-muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
  th { color: var(--fg-muted); font-weight: 600; }
  code { background: var(--code-bg); color: var(--fg); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--btn-border); border-radius: 4px; background: var(--btn-bg); color: var(--fg); cursor: pointer; }
  button:hover:not(:disabled) { background: var(--btn-bg-hover); }
  button:focus-visible { outline: 2px solid #4d90fe; outline-offset: 1px; }
  button:disabled { opacity: .55; cursor: default; }
  button.danger { border-color: var(--danger); color: var(--danger); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.on { background: var(--badge-on-bg); color: var(--badge-on-fg); }
  .badge.off { background: var(--badge-off-bg); color: var(--badge-off-fg); }
  .empty { color: var(--fg-muted); font-style: italic; padding: 8px 0; }
  .err { color: var(--danger); margin-top: 8px; }
  .row-actions { white-space: nowrap; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  input[type=text] { font: inherit; padding: 4px 8px; border: 1px solid var(--btn-border); border-radius: 4px; width: 140px; background: var(--bg); color: var(--fg); }
</style>
</head>
<body>
  <h1>rc-mcp admin</h1>
  <p class="sub">Loopback-only. This page and every request it makes stay on <code>127.0.0.1</code>.</p>

  <section aria-labelledby="pending-heading">
    <h2 id="pending-heading">Pending pairing codes</h2>
    <div id="pending-list" aria-live="polite"></div>
  </section>

  <section aria-labelledby="devices-heading">
    <h2 id="devices-heading">Paired devices</h2>
    <div id="devices-list" aria-live="polite"></div>
  </section>

  <section aria-labelledby="audit-heading">
    <h2 id="audit-heading">Audit log</h2>
    <div id="audit-list" aria-live="polite"></div>
    <div class="pager">
      <button id="audit-prev">&laquo; newer</button>
      <button id="audit-next">older &raquo;</button>
      <span id="audit-range"></span>
    </div>
  </section>

<script>
const AUDIT_PAGE_SIZE = 25;
let auditOffset = 0;

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { const body = await res.json(); if (body.error) msg = body.error; } catch (e) {}
    throw new Error(msg);
  }
  if (res.status === 204) return null;
  return res.json();
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'text') e.textContent = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => e.appendChild(c));
  return e;
}

function showError(container, err) {
  container.appendChild(el('div', { class: 'err', role: 'alert', text: 'Error: ' + err.message }));
}

async function loadPending() {
  const container = document.getElementById('pending-list');
  container.innerHTML = '';
  try {
    const codes = await api('/admin/pending');
    const pending = (codes || []).filter(c => !c.used && new Date(c.expiresAt) > new Date());
    if (pending.length === 0) {
      container.appendChild(el('div', { class: 'empty', text: 'No pending pairing codes.' }));
      return;
    }
    const table = el('table', {}, [
      el('tr', {}, [
        el('th', { text: 'Code' }), el('th', { text: 'Hostname' }),
        el('th', { text: 'Expires' }), el('th', { text: 'Actions' }),
      ]),
    ]);
    for (const c of pending) {
      const approveBtn = el('button', { text: 'Approve', 'aria-label': 'Approve pairing code ' + c.code + ' for ' + c.hostname });
      approveBtn.onclick = async () => {
        approveBtn.disabled = true;
        try {
          await api('/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: c.code }) });
          await refreshAll();
        } catch (err) { showError(container, err); approveBtn.disabled = false; }
      };
      const rejectBtn = el('button', { text: 'Reject', class: 'danger', 'aria-label': 'Reject pairing code ' + c.code + ' for ' + c.hostname });
      rejectBtn.onclick = async () => {
        rejectBtn.disabled = true;
        try {
          await api('/admin/reject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: c.code }) });
          await refreshAll();
        } catch (err) { showError(container, err); rejectBtn.disabled = false; }
      };
      table.appendChild(el('tr', {}, [
        el('td', {}, [el('code', { text: c.code })]),
        el('td', { text: c.hostname }),
        el('td', { text: new Date(c.expiresAt).toLocaleString() }),
        el('td', { class: 'row-actions' }, [approveBtn, rejectBtn]),
      ]));
    }
    container.appendChild(table);
  } catch (err) {
    showError(container, err);
  }
}

async function loadDevices() {
  const container = document.getElementById('devices-list');
  container.innerHTML = '';
  try {
    const data = await api('/admin/devices');
    const devs = data.devices || [];
    if (devs.length === 0) {
      container.appendChild(el('div', { class: 'empty', text: 'No paired devices.' }));
      return;
    }
    const table = el('table', {}, [
      el('tr', {}, [
        el('th', { text: 'Device' }), el('th', { text: 'Status' }),
        el('th', { text: 'Capabilities' }), el('th', { text: 'Last seen' }), el('th', { text: 'Actions' }),
      ]),
    ]);
    for (const d of devs) {
      const revokeBtn = el('button', { text: 'Revoke', class: 'danger', 'aria-label': 'Revoke device ' + (d.label || d.clientId) });
      revokeBtn.onclick = async () => {
        if (!confirm('Revoke device ' + d.label + ' (' + d.clientId + ')? This cannot be undone.')) return;
        revokeBtn.disabled = true;
        try {
          await api('/admin/devices/' + encodeURIComponent(d.clientId), { method: 'DELETE' });
          await refreshAll();
        } catch (err) { showError(container, err); revokeBtn.disabled = false; }
      };
      table.appendChild(el('tr', {}, [
        el('td', {}, [
          el('div', { text: d.label || d.clientId }),
          el('div', {}, [el('code', { text: d.clientId })]),
        ]),
        el('td', {}, [el('span', { class: 'badge ' + (d.online ? 'on' : 'off'), text: d.online ? 'online' : 'offline' })]),
        el('td', { text: (d.capabilities || []).join(', ') || '—' }),
        el('td', { text: d.lastSeen ? new Date(d.lastSeen).toLocaleString() : '—' }),
        el('td', { class: 'row-actions' }, [revokeBtn]),
      ]));
    }
    container.appendChild(table);
  } catch (err) {
    showError(container, err);
  }
}

async function loadAudit() {
  const container = document.getElementById('audit-list');
  container.innerHTML = '';
  try {
    const data = await api('/admin/audit?limit=' + AUDIT_PAGE_SIZE + '&offset=' + auditOffset);
    const entries = data.entries || [];
    document.getElementById('audit-range').textContent = entries.length
      ? ('showing ' + (auditOffset + 1) + '–' + (auditOffset + entries.length))
      : '';
    document.getElementById('audit-prev').disabled = auditOffset === 0;
    document.getElementById('audit-next').disabled = entries.length < AUDIT_PAGE_SIZE;
    if (entries.length === 0) {
      container.appendChild(el('div', { class: 'empty', text: 'No audit log entries.' }));
      return;
    }
    const table = el('table', {}, [
      el('tr', {}, [
        el('th', { text: 'Time' }), el('th', { text: 'Session' }), el('th', { text: 'Device' }),
        el('th', { text: 'Tool' }), el('th', { text: 'Status' }), el('th', { text: 'Duration' }), el('th', { text: 'Args' }),
      ]),
    ]);
    for (const e of entries) {
      table.appendChild(el('tr', {}, [
        el('td', { text: new Date(e.timestamp).toLocaleString() }),
        el('td', {}, [el('code', { text: e.sessionId })]),
        el('td', {}, [el('code', { text: e.clientId })]),
        el('td', { text: e.tool }),
        el('td', { text: e.status }),
        el('td', { text: e.durationMs + ' ms' }),
        el('td', { text: e.argsHint || '' }),
      ]));
    }
    container.appendChild(table);
  } catch (err) {
    showError(container, err);
  }
}

document.getElementById('audit-prev').onclick = () => { auditOffset = Math.max(0, auditOffset - AUDIT_PAGE_SIZE); loadAudit(); };
document.getElementById('audit-next').onclick = () => { auditOffset += AUDIT_PAGE_SIZE; loadAudit(); };

async function refreshAll() {
  await Promise.all([loadPending(), loadDevices(), loadAudit()]);
}

refreshAll();
setInterval(() => { loadPending(); loadDevices(); }, 5000);
</script>
</body>
</html>
