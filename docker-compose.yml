services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: rc-mcp-server:latest
    ports:
      - "127.0.0.1:8080:8080" # MCP + agent WS (behind nginx)
      - "127.0.0.1:9090:9090" # admin API (loopback only, not proxied)
    env_file:
      - .env
    environment:
      - MCP_BIND_ADDR=0.0.0.0:8080
      - ADMIN_BIND_ADDR=0.0.0.0:9090
      - MCP_SESSION_STORE=memory
    volumes:
      - audit-log:/var/log/rc-mcp
      - device-registry:/var/lib/rc-mcp # persistent device registry
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # No container-level HEALTHCHECK: distroless/static has no shell or
    # wget/curl to run one. Liveness is monitored externally via GET
    # /health (unauthenticated, per Section 14), e.g. by nginx's
    # upstream check or an external prober.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - mcp-server
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Shared backing store for multi-replica deployments (Section 10,
  # Section 19). Opt-in via the "scaling" Compose profile -- `docker
  # compose up` alone never starts this, so single-instance deployments
  # are unaffected. See docs/operations/scaling.md.
  redis:
    image: redis:7-alpine
    profiles: ["scaling"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  audit-log:
  device-registry:
  redis-data:
