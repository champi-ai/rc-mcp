version: "2"

linters:
  settings:
    errcheck:
      # Best-effort cleanup (deferred Close on files, HTTP response bodies,
      # loggers, websocket/redis connections, ...) is exempted: there's
      # nothing actionable to do with a Close error once we're already
      # tearing down, and errcheck otherwise flags every such call across
      # the codebase. Everything else stays checked.
      exclude-functions:
        - (*os.File).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*github.com/champi-ai/rc-mcp/agent/client.Connection).Close
        - (*github.com/champi-ai/rc-mcp/internal/audit.Logger).Close
        - (github.com/champi-ai/rc-mcp/internal/redisclient.Subscription).Close
        - (github.com/champi-ai/rc-mcp/internal/redisclient.KVStore).Close
